<!--
  INSTATION — Apple Music Edition
  전면 재작성: 컨셉 디자인 기반 + 모든 원본 로직 보존
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INSTATION">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>INSTATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,300&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>

<style>
/* =============================================
   RESET & ROOT
============================================= */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#000;
  --text:#fff;
  --text2:rgba(255,255,255,.72);
  --text3:rgba(255,255,255,.42);
  --text4:rgba(255,255,255,.22);
  --glass:rgba(255,255,255,.07);
  --glass2:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.09);
  --border2:rgba(255,255,255,.05);
  --accent:#ff375f;
  --accent-dim:rgba(255,55,95,.16);
  --accent-glow:rgba(255,55,95,.32);
  --r-hero:40px;
  --r-card:32px;
  --r-thumb:14px;
  --r-pill:999px;
  --r-player:34px;
  --font:'Inter',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --nav-h:68px;
  --player-h:90px;
  --tabbar-h:60px;
  --sidebar-w:400px;
}

html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#000;color:#fff;
  font-family:var(--font);
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}

/* =============================================
   AMBIENT BACKGROUND
============================================= */
.bg{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;
}

/* dual-layer crossfade bg */
.bg-layer{
  position:absolute;inset:-10%;
  background-size:cover;background-position:center;
  filter:blur(100px) brightness(.32) saturate(1.6);
  transform:scale(1.2);
  opacity:0;
  transition:opacity 2.2s cubic-bezier(.4,0,.2,1);
  will-change:opacity;
}
.bg-layer.active{
  opacity:1;
  animation:bgFloat 22s ease-in-out infinite alternate;
  animation-delay:-2.2s; /* transition 길이만큼 딜레이 당겨서 transform 점프 방지 */
}
@keyframes bgFloat{
  from{transform:scale(1.2) translate(-10px,-14px)}
  to{transform:scale(1.3) translate(10px,14px)}
}

/* static fallback when no art */
.bg-default{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 80% at 70% 20%, #1a0a0e 0%, #000 60%);
}

/* accent glows */
.bg-glow-r{
  position:absolute;
  width:900px;height:900px;
  background:radial-gradient(circle, rgba(255,55,95,.18) 0%, transparent 70%);
  top:-300px;right:-200px;
  filter:blur(60px);
  animation:glowR 16s ease-in-out infinite alternate;
}
@keyframes glowR{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(-100px,120px) scale(1.2)}
}
.bg-glow-b{
  position:absolute;
  width:700px;height:700px;
  background:radial-gradient(circle, rgba(70,100,255,.09) 0%, transparent 70%);
  bottom:-200px;left:-100px;
  filter:blur(70px);
  animation:glowB 20s ease-in-out infinite alternate;
}
@keyframes glowB{
  from{transform:translate(0,0)}
  to{transform:translate(80px,-80px)}
}

.bg-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.2) 0%, rgba(0,0,0,.55) 100%);
}

/* grain */
.bg-grain{
  position:absolute;inset:0;z-index:10;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.042'/%3E%3C/svg%3E");
  background-size:180px;opacity:.8;mix-blend-mode:overlay;
}

/* =============================================
   DESKTOP APP SHELL
============================================= */
#appDesktop{
  position:relative;z-index:5;
  height:100vh;
  display:grid;
  grid-template-rows:var(--nav-h) 1fr var(--player-h);
  grid-template-columns:1fr var(--sidebar-w);
  overflow:hidden;
}

/* =============================================
   NAVBAR
============================================= */
.nav{
  grid-column:1/-1;grid-row:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px 0 32px;
  background:rgba(0,0,0,.24);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-bottom:1px solid var(--border2);
  position:relative;z-index:50;
}

.nav-logo{
  font-size:22px;font-weight:900;letter-spacing:-1.2px;
  background:linear-gradient(130deg,#fff 35%,rgba(255,255,255,.5));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  flex-shrink:0;
}
.nav-logo em{-webkit-text-fill-color:var(--accent);color:var(--accent);font-style:normal}

/* tab switcher */
.nav-tabs{
  display:flex;gap:2px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  border-radius:var(--r-pill);
  padding:4px;
}
.nav-tab{
  height:34px;padding:0 18px;
  border-radius:var(--r-pill);border:none;
  background:transparent;color:var(--text3);
  font-size:13px;font-weight:600;letter-spacing:-.2px;
  cursor:pointer;transition:all .2s ease;white-space:nowrap;
  font-family:var(--font);
}
.nav-tab:hover:not(.active){color:var(--text2)}
.nav-tab.active{background:rgba(255,255,255,.12);color:#fff}

.nav-right{display:flex;align-items:center;gap:10px}

.on-air{
  display:flex;align-items:center;gap:7px;
  height:34px;padding:0 14px;
  border-radius:var(--r-pill);
  background:var(--accent-dim);
  border:1px solid rgba(255,55,95,.3);
  font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent);
  opacity:0;transition:opacity .4s;white-space:nowrap;
}
.on-air.live{opacity:1}
.on-air-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  flex-shrink:0;
  animation:dotPulse 1.5s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.7)}}

.nav-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  background:var(--glass);color:var(--text2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s ease;flex-shrink:0;
}
.nav-btn:hover{background:rgba(255,255,255,.12);color:#fff;transform:translateY(-1px)}
.nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* =============================================
   HERO — LEFT MAIN AREA
============================================= */
.hero-wrap{
  grid-column:1;grid-row:2;
  padding:22px 20px 22px 28px;
  display:flex;flex-direction:column;
  overflow:hidden;
  position:relative;
}

.hero-card{
  position:relative;overflow:hidden;
  border-radius:var(--r-hero);
  flex:1;min-height:0;
  display:flex;align-items:flex-end;
  background:#0c0c0c;
  box-shadow:0 40px 140px rgba(0,0,0,.75);
  isolation:isolate;
  cursor:pointer;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.hero-card:active{transform:scale(.993)}

/* hero play/pause overlay — click flash only, no hover */
.hero-art-overlay{
  position:absolute;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  border-radius:inherit;
}
.hero-art-overlay-icon{
  width:80px;height:80px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1.5px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  opacity:0;
}
.hero-art-overlay-icon svg{width:32px;height:32px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
@keyframes heroIconFlash{
  0%  {opacity:0;transform:scale(.7)}
  20% {opacity:1;transform:scale(1.08)}
  60% {opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.9)}
}
.hero-art-overlay-icon.flash{
  animation:heroIconFlash .7s cubic-bezier(.4,0,.2,1) forwards;
}

/* hero image layers */
.hero-img-a,.hero-img-b{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:0;
  transition:opacity 1.4s cubic-bezier(.4,0,.2,1);
  will-change:opacity;
}
.hero-img-a.active,.hero-img-b.active{
  opacity:1;
  animation:heroFloat 18s ease-in-out infinite alternate;
  animation-delay:-1.4s;
}
@keyframes heroFloat{
  0%{
    transform:
      scale(1.04)
      translate3d(-1%, -1%, 0)
      rotate(-0.3deg);
  }

  50%{
    transform:
      scale(1.07)
      translate3d(1%, 1%, 0)
      rotate(0.2deg);
  }

  100%{
    transform:
      scale(1.04)
      translate3d(-1%, -1%, 0)
      rotate(-0.3deg);
  }
}

/* gradient overlays */
.hero-grad{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(0,0,0,.06) 0%,
    rgba(0,0,0,.04) 25%,
    rgba(0,0,0,.45) 65%,
    rgba(0,0,0,.92) 100%
  );
}

/* liquid sheen */
.hero-card::before{
  content:'';position:absolute;inset:0;z-index:3;
  background:linear-gradient(145deg,rgba(255,255,255,.045) 0%,transparent 45%);
  pointer-events:none;
}

/* hero content */
.hero-body{
  position:relative;z-index:10;
  padding:44px 48px;
  width:100%;
}

.hero-overline{
  display:flex;align-items:center;gap:12px;
  font-size:11px;font-weight:700;letter-spacing:.2em;
  color:rgba(255,255,255,.6);text-transform:uppercase;
  margin-bottom:18px;
}
.hero-overline-bar{width:20px;height:1px;background:rgba(255,255,255,.35)}
.hero-overline-cat{
  padding:4px 10px;border-radius:var(--r-pill);
  background:var(--accent-dim);border:1px solid rgba(255,55,95,.28);
  color:var(--accent);font-size:9px;letter-spacing:.18em;
}
.hero-art img{
  object-fit:cover;
  object-position:center 30%;
}
.hero-title{
  font-size:clamp(36px,4.8vw,68px);
  line-height:.92;font-weight:900;letter-spacing:-3px;
  color:#fff;
  text-shadow:0 12px 50px rgba(0,0,0,.9);
  margin-bottom:16px;
  /* smooth transition when title changes */
  transition:opacity .4s;
}
.hero-title.fading{opacity:0}

.hero-meta{
  font-size:15px;font-weight:400;color:rgba(255,255,255,.68);
  line-height:1.6;margin-bottom:30px;
  font-style:italic;letter-spacing:-.2px;
  min-height:26px;
  transition:opacity .4s;
}
.hero-meta.fading{opacity:0}

/* np loading pulse */
.hero-np-loading{
  display:inline-block;
  font-size:12px;font-weight:500;letter-spacing:.08em;
  color:rgba(255,255,255,.3);
  animation:npBlink 1.6s ease-in-out infinite;
}
@keyframes npBlink{0%,100%{opacity:1}50%{opacity:.2}}

.hero-actions{display:flex;align-items:center;gap:12px}

.btn-play{
  height:56px;padding:0 30px;
  border-radius:var(--r-pill);border:none;
  background:#fff;color:#000;
  font-size:15px;font-weight:700;letter-spacing:-.25px;
  cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:.28s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 28px rgba(0,0,0,.4);
  font-family:var(--font);
}
.btn-play:hover{transform:scale(1.04) translateY(-1px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.btn-play:active{transform:scale(.96)}
.btn-play svg{width:15px;height:15px;flex-shrink:0}

.btn-ghost{
  height:56px;padding:0 24px;
  border-radius:var(--r-pill);
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:-.2px;
  cursor:pointer;
  backdrop-filter:blur(16px);
  transition:.22s ease;
  font-family:var(--font);
}
.btn-ghost:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.26)}
.btn-ghost:active{transform:scale(.97)}

/* hero badge — bottom right */
.hero-badge{
  position:absolute;bottom:44px;right:44px;z-index:10;
  text-align:right;
  opacity:0;transform:translateY(6px);
  transition:opacity .5s,transform .5s;
}
.hero-badge.visible{opacity:1;transform:translateY(0)}
.hero-badge-freq{
  font-size:26px;font-weight:900;letter-spacing:-1px;
  color:rgba(255,255,255,.88);
}
.hero-badge-label{
  font-size:9px;font-weight:600;letter-spacing:.28em;
  color:rgba(255,255,255,.38);text-transform:uppercase;
  margin-top:3px;
}

/* =============================================
   SIDEBAR — RIGHT PANEL
============================================= */
.sidebar{
  grid-column:2;grid-row:2;
  display:flex;flex-direction:column;
  overflow:hidden;
  border-left:1px solid var(--border2);
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(32px);
  -webkit-backdrop-filter:blur(32px);
  position:relative;z-index:5;
}

/* sidebar tabs */
.sidebar-tabs{
  display:flex;
  border-bottom:1px solid var(--border2);
  padding:0 20px;
  flex-shrink:0;
  gap:0;
}
.sidebar-tab{
  flex:1;height:48px;
  background:none;border:none;color:var(--text3);
  font-size:12px;font-weight:600;letter-spacing:-.1px;
  cursor:pointer;transition:color .18s;
  position:relative;font-family:var(--font);
}
.sidebar-tab:hover{color:var(--text2)}
.sidebar-tab.active{color:#fff}
.sidebar-tab.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:1.5px;background:#fff;border-radius:1px;
}

/* sidebar header (channel count + filter) */
.sidebar-head{
  padding:14px 20px 12px;
  border-bottom:1px solid var(--border2);
  flex-shrink:0;
}
.sidebar-head-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.sidebar-head-label{
  font-size:11px;font-weight:600;color:var(--text3);letter-spacing:-.1px;
}
.sidebar-count{
  font-size:10px;font-weight:600;
  background:var(--glass);border:1px solid var(--border);
  padding:3px 10px;border-radius:var(--r-pill);color:var(--text4);
}

/* filter chips */
.filter-chips{
  display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
}
.filter-chips::-webkit-scrollbar{display:none}
.fchip{
  flex-shrink:0;height:26px;padding:0 12px;
  border-radius:var(--r-pill);border:1px solid var(--border);
  background:transparent;color:var(--text3);
  font-size:11px;font-weight:600;letter-spacing:-.1px;
  cursor:pointer;transition:.16s ease;white-space:nowrap;
  font-family:var(--font);
}
.fchip:hover{border-color:rgba(255,255,255,.18);color:var(--text2)}
.fchip.active{
  background:var(--accent-dim);
  border-color:rgba(255,55,95,.38);
  color:var(--accent);
}

/* channel list */
.ch-list{
  flex:1;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent;
  padding:6px 0 8px;
}
.ch-list::-webkit-scrollbar{width:2px}
.ch-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:1px}

/* channel item */
.ch-item{
  display:flex;align-items:center;gap:13px;
  padding:9px 20px;
  cursor:pointer;
  transition:background .14s;
  position:relative;
}
.ch-item::before{
  content:'';
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:0;background:var(--accent);border-radius:0 1px 1px 0;
  transition:height .22s cubic-bezier(.4,0,.2,1);
}
.ch-item:hover{background:rgba(255,255,255,.04)}
.ch-item:hover::before{height:55%}
.ch-item.active{background:rgba(255,55,95,.07)}
.ch-item.active::before{height:70%}

.ch-thumb{
  width:50px;height:50px;border-radius:var(--r-thumb);
  overflow:hidden;flex-shrink:0;background:#111;
  box-shadow:0 4px 14px rgba(0,0,0,.45);
  position:relative;
}
.ch-thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .45s ease;
}
.ch-item:hover .ch-thumb img{transform:scale(1.1)}
.ch-thumb-ph{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#111,#1a1a28);
  font-size:18px;
}

.ch-info{flex:1;min-width:0}
.ch-name{
  font-size:13px;font-weight:600;letter-spacing:-.25px;
  color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:3px;
  transition:color .16s;
}
.ch-item.active .ch-name{color:#fff}
.ch-cat{
  font-size:11px;color:var(--text4);font-weight:400;
}

.ch-end{
  flex-shrink:0;display:flex;align-items:center;width:22px;justify-content:flex-end;
}
.ch-num{font-size:10px;color:var(--text4);font-weight:500;letter-spacing:.04em}
.ch-eq{
  display:flex;align-items:flex-end;gap:2px;height:16px;
  opacity:0;
  transition:opacity .2s;
}
.ch-item.active .ch-num{display:none}
.ch-item.active .ch-eq{opacity:1}
.eq-bar{
  width:3px;border-radius:1px;background:var(--accent);
  transform-origin:bottom;
  animation:eqA .55s ease-in-out infinite alternate;
}
.eq-bar:nth-child(1){height:30%;animation-delay:0s}
.eq-bar:nth-child(2){height:100%;animation-delay:.15s}
.eq-bar:nth-child(3){height:55%;animation-delay:.28s}
@keyframes eqA{from{transform:scaleY(.18)}to{transform:scaleY(1)}}

/* =============================================
   EXTRA CHANNELS PANEL (replaces ch-list when active)
============================================= */
.extra-panel{
  flex:1;overflow:hidden;
  display:none;flex-direction:column;
}
.extra-panel.active{display:flex}
.ch-list-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
.ch-list-wrap.hidden{display:none}

.extra-filter{
  padding:14px 20px 10px;border-bottom:1px solid var(--border2);flex-shrink:0;
}
.extra-chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.extra-chips::-webkit-scrollbar{display:none}

.extra-list{
  flex:1;overflow-y:auto;padding:6px 0 8px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent;
}
.extra-list::-webkit-scrollbar{width:2px}
.extra-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:1px}

.extra-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 20px;cursor:pointer;
  transition:background .14s;
  position:relative;
}
.extra-item::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2px;height:0;background:var(--accent);border-radius:0 1px 1px 0;
  transition:height .2s;
}
.extra-item:hover{background:rgba(255,255,255,.04)}
.extra-item:hover::before{height:55%}
.extra-item.active{background:var(--accent-dim)}
.extra-item.active::before{height:70%}
.ex-num{font-size:10px;color:var(--text4);width:22px;text-align:right;flex-shrink:0}
.ex-info{flex:1;min-width:0}
.ex-name{
  font-size:13px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.extra-item.active .ex-name{color:#fff}
.ex-cat{font-size:11px;color:var(--text4)}
.ex-eq{
  display:flex;align-items:flex-end;gap:2px;height:14px;
  opacity:0;
}
.extra-item.active .ex-eq{opacity:1}
.extra-item.active .ex-num{display:none}

/* extra item thumbnail */
.ex-thumb{
  width:46px;height:46px;border-radius:12px;
  overflow:hidden;flex-shrink:0;
  background:#111;
  box-shadow:0 4px 14px rgba(0,0,0,.45);
  position:relative;
}
.ex-thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;
  transition:opacity .4s ease, transform .45s ease;
}
.ex-thumb img.loaded{opacity:1}
.ex-thumb-ph{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#111,#1a1a28);
  font-size:18px;
  transition:opacity .3s;
}
.ex-thumb img.loaded + .ex-thumb-ph,
.ex-thumb.has-img .ex-thumb-ph{opacity:0}
.extra-item:hover .ex-thumb img{transform:scale(1.08)}

/* =============================================
   PLAYER PILL — BOTTOM
============================================= */
.player-pill{
  grid-column:1/-1;grid-row:3;
  margin:0 18px calc(14px + var(--safe-b));
  border-radius:var(--r-player);
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 24px 90px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.06) inset;
  transition:transform .32s cubic-bezier(.4,0,.2,1),box-shadow .32s;
  cursor:default;
}
.player-pill:hover{
  transform:translateY(-2px);
  box-shadow:0 32px 110px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.08) inset;
}

/* art-reactive bg */
.pp-bg-a,.pp-bg-b{
  position:absolute;inset:-50px;
  background-size:cover;background-position:center;
  filter:blur(28px) brightness(.34) saturate(2.2);
  opacity:0;transition:opacity 1.8s ease;z-index:0;
}
.pp-bg-a.active,.pp-bg-b.active{opacity:1}
.pp-glass{
  position:absolute;inset:0;z-index:1;
  background:rgba(14,14,20,.62);
  backdrop-filter:blur(44px) saturate(1.6);
  -webkit-backdrop-filter:blur(44px) saturate(1.6);
}

.pp-inner{
  position:relative;z-index:2;
  height:var(--player-h);
  display:flex;align-items:center;
  padding:0 24px;gap:18px;
}

/* art */
.pp-art{
  width:62px;height:62px;border-radius:18px;
  overflow:hidden;flex-shrink:0;
  background:#111;
  box-shadow:0 6px 22px rgba(0,0,0,.55);
  position:relative;
}
.pp-art img{width:100%;height:100%;object-fit:cover;display:block}
.pp-art-ph{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;opacity:.4;
}
/* clickable album art — play/pause overlay */
.pp-art{cursor:pointer;transition:box-shadow .8s ease}
@media(hover:hover){
  .pp-art:hover .pp-art-overlay{opacity:1}
}
.pp-art:active{transform:scale(.92)}
.pp-art-overlay{
  position:absolute;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.48);
  opacity:0;
  transition:opacity .18s ease;
  border-radius:inherit;
}
.pp-art-overlay svg{width:22px;height:22px;fill:#fff;drop-shadow:0 2px 8px rgba(0,0,0,.5)}

/* glow ring via box-shadow (::before conflicts with overflow:hidden) */
.pp-art{transition:box-shadow .8s ease, transform .12s ease}
.pp-art.has-art{
  animation:artGlow 3.5s ease-in-out infinite alternate;
}
@keyframes artGlow{
  from{box-shadow:0 6px 22px rgba(0,0,0,.55),0 0 0 2px rgba(255,55,95,.3),0 0 24px rgba(255,55,95,.2)}
  to{box-shadow:0 6px 22px rgba(0,0,0,.55),0 0 0 2px rgba(255,55,95,.55),0 0 44px rgba(255,55,95,.38)}
}

/* track info */
.pp-track{flex:1;min-width:0;overflow:hidden}
.pp-tag{
  font-size:9px;font-weight:700;letter-spacing:.2em;
  color:var(--text3);text-transform:uppercase;
  margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pp-marquee-wrap{
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 3%,#000 93%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 3%,#000 93%,transparent 100%);
  contain:layout style;
}
.pp-marquee-wrap.short{-webkit-mask-image:none;mask-image:none}
.pp-marquee-inner{
  display:inline-flex; /* flex로 변경 → 자식 span width 정확히 반영 */
  white-space:nowrap;
  will-change:transform;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}
.pp-marquee-inner.running{
  animation:mqScroll var(--mq-dur,14s) linear infinite;
}
@keyframes mqScroll{
  0%  {transform:translate3d(0,0,0)}
  100%{transform:translate3d(var(--mq-dist,0px),0,0)}
}
.pp-title{font-size:17px;font-weight:700;letter-spacing:-.4px;color:#fff}
.pp-artist{font-size:13px;color:var(--text3);margin-top:2px;display:block}

/* controls */
.pp-controls{display:flex;align-items:center;gap:10px;flex-shrink:0}

.pp-freq{
  font-size:10px;font-weight:600;letter-spacing:.06em;
  color:var(--text4);flex-shrink:0;margin-right:4px;
}

.pp-skip{
  width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s ease;
  flex-shrink:0;
}
.pp-skip:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.16);transform:scale(1.06)}
.pp-skip:active{transform:scale(.92)}
.pp-skip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.pp-play{
  width:56px;height:56px;border-radius:50%;
  border:none;
  background:#fff;color:#000;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:.22s cubic-bezier(.4,0,.2,1);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.pp-play:hover{transform:scale(1.07);box-shadow:0 6px 28px rgba(0,0,0,.5)}
.pp-play:active{transform:scale(.93)}
.pp-play svg{width:18px;height:18px;flex-shrink:0}

/* volume */
.pp-vol{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:120px}
.pp-vol-btn{
  background:none;border:none;color:var(--text4);
  font-size:12px;cursor:pointer;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  transition:color .15s;
}
.pp-vol-btn:hover{color:var(--text2)}
.pp-vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:3px;background:rgba(255,255,255,.16);border-radius:2px;
  outline:none;border:none;cursor:pointer;min-width:60px;
}
.pp-vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,.8);cursor:pointer;transition:transform .14s;
}
.pp-vol-slider::-webkit-slider-thumb:hover{transform:scale(1.25)}
.pp-vol-slider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,.8);border:none;cursor:pointer;
}

/* =============================================
   MOBILE — FULL-SCREEN LAYOUT
============================================= */
#appMobile{display:none}

/* Mobile channel list screen */
#mobChannels{
  position:fixed;inset:0;
  background:#000;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--tabbar-h) + var(--safe-b));

}

.mob-nav{
  position:sticky;top:0;z-index:20;

}
.mob-nav-top{
  display:flex;align-items:center;justify-content:space-between;

}
.mob-logo{font-size:19px;font-weight:900;letter-spacing:-1px}

.mob-on-air{
  display:flex;align-items:center;gap:6px;

}
.mob-on-air.live{opacity:1}
.mob-on-air-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dotPulse 1.5s ease-in-out infinite}

.mob-filter{
  overflow-x:auto;scrollbar-width:none;

}
.mob-filter::-webkit-scrollbar{display:none}

.mob-grid{padding:14px 16px 4px}
.mob-grid-label{

  color:var(--text4);text-transform:uppercase;margin-bottom:14px;
}

/* Mobile 2-col grid cards */
.mob-cards{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.mob-card{
  position:relative;overflow:hidden;
  border-radius:var(--r-card);
  aspect-ratio:3/4;
  background:#0d0d0d;
  cursor:pointer;
}
.mob-card img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
  transition:transform .5s ease;
}
.mob-card:active img{transform:scale(1.06)}
.mob-card-grad{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.9) 100%);
  z-index:1;
}
.mob-card-info{
  position:absolute;bottom:0;left:0;right:0;
  padding:12px 13px;z-index:2;
}
.mob-card-cat{
  font-size:8px;font-weight:700;letter-spacing:.18em;
  color:var(--accent);opacity:.85;margin-bottom:4px;
  text-transform:uppercase;
}
.mob-card-name{
  font-size:12px;font-weight:700;line-height:1.3;
  color:rgba(255,255,255,.95);
}
.mob-card-active-bar{
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  display:none;z-index:3;
}
.mob-card.active::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.85),
    inset 0 -80px 120px rgba(255,55,95,.18);

  z-index:3;
  pointer-events:none;
}
/*.mob-card.active .mob-card-active-bar{display:block}*/
.mob-card{
  transition:
    transform .3s ease,
    filter .3s ease;
}

.mob-card.active{

  animation:cardBreath 3.2s ease-in-out infinite;

}

.mob-card.active img{

  animation:cardImageBreath 3.2s ease-in-out infinite;

}

@keyframes cardBreath{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.018);
  }

}

@keyframes cardImageBreath{

  0%,100%{
    filter:
      brightness(1)
      saturate(1);
  }

  50%{
    filter:
      brightness(.82)
      saturate(1.08);
  }

}
/* Mobile player screen */
#mobPlayer{
  position:fixed;inset:0;

  display:none;flex-direction:column;

}
#mobPlayer.active{display:flex}

   TABBAR (mobile)
============================================= */

============================================= */

}

<script>

document.addEventListener('contextmenu',e=>e.preventDefault());

/* ── channel data ── */
const BASE_IMG='https://cdn.inlive.co.kr/inLive/image/instation/';
const channels=[

  {id:208,img:'ori_img18',  name:'응답하라! 추억의 가요',  cat:'가요'},
  {id:9,  img:'ori_img13',  name:'7080 Pop 컬렉션',        cat:'POP'},
  {id:10, img:'ori_img15',  name:'봄에 어울리는 음악',     cat:'음악방송'},
  {id:11, img:'ori_img14',  name:'영화 OST',               cat:'OST'},
  {id:12, img:'ori_img17',  name:'드라마 OST',             cat:'OST'},

  {id:213,img:'ori_img121', name:'편안한 독서 & 집중',     cat:'음악방송'},
  {id:214,img:'ori_img122', name:'이지리스닝 연주',        cat:'연주'},

  {id:217,img:'ori_img125', name:'재즈힙합 라운지',        cat:'재즈'},
  {id:218,img:'ori_img126', name:'보사노바 & 라틴',        cat:'연주'},
];

/* ── state ── */
const aud=document.getElementById('aud');
let activeId=null, isMuted=false;
let activeExtraIdx=null, extraFiltered=[], extraCurrentTag='ALL', extraChannels=[];
let npTimer=null, lastTrackStr='', currentArtUrl=null, _artImgs=[];
let isSkipping=false;
let autoSkipTimer=null, connectTimer=null;
const skippedIds=new Set(), skippedExtraUrls=new Set();
const AUTO_SKIP_SEC=60, CONNECT_TIMEOUT_SEC=30;

/* ── helpers ── */
const isMobile=()=>window.innerWidth<=680;
function getPort(id){return 10000+id*10}
function fakeFreq(id){
  const i=channels.findIndex(c=>c.id===id);
  return(87.5+(108-87.5)/channels.length*i).toFixed(1)+' FM';
}
function decodeHtml(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent||s}
function toListenUrl(u){try{const x=new URL(u);return`https://${x.hostname}/listen.html?port=${x.port}`}catch{return u}}

/* ── on-air state ── */
function setOnAir(on){
  document.querySelectorAll('.on-air,.mob-on-air,.mp-on-air').forEach(el=>el.classList.toggle('live',on));
  document.getElementById('tabDot').classList.toggle('on',on);
}

/* ── timers ── */
function startConnectTimer(){
  clearConnectTimer();
  connectTimer=setTimeout(()=>{isSkipping=true;playNextChannel(true)},CONNECT_TIMEOUT_SEC*1000);
}
function clearConnectTimer(){if(connectTimer){clearTimeout(connectTimer);connectTimer=null}}
/* autoSkip은 connectTimer 보조용으로만 유지 — 정상 재생 중에는 호출하지 않음 */
function startAutoSkip(){clearAutoSkip()}
function clearAutoSkip(){if(autoSkipTimer){clearTimeout(autoSkipTimer);autoSkipTimer=null}}

/* ── audio events ── */
let waitingTimer=null;
let retryCount=0;
const MAX_RETRIES=3;
const RETRY_DELAY=3000;

aud.addEventListener('playing',()=>{
  isSkipping=false;retryCount=0;clearTimeout(waitingTimer);waitingTimer=null;
  setOnAir(true);clearConnectTimer();clearAutoSkip();updateMediaSession();
});

aud.addEventListener('waiting',()=>{

  setOnAir(false);

  clearTimeout(waitingTimer);

  waitingTimer=setTimeout(()=>{

    if(!aud.paused && aud.readyState < 2){

      startConnectTimer();

    }

  },8000);

});
aud.addEventListener('pause',()=>{
  clearTimeout(waitingTimer);waitingTimer=null;
  setOnAir(false);clearAutoSkip();
  if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused';
});

aud.addEventListener('error',()=>{

  clearTimeout(waitingTimer);waitingTimer=null;
  setOnAir(false);
  clearConnectTimer();

  if(isSkipping)return;

  if(retryCount < MAX_RETRIES){

    retryCount++;

    console.log('stream retry', retryCount);

    setTimeout(()=>{

      aud.load();

      aud.play().catch(()=>{});

      startConnectTimer();

    }, RETRY_DELAY);

    return;
  }

  retryCount=0;

  playNextChannel(true);

});
aud.addEventListener('stalled',()=>{setOnAir(false);clearConnectTimer();if(!isSkipping)startConnectTimer()});

/* ── visibility ── */
let _wasPlaying=false;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){_wasPlaying=!aud.paused;clearConnectTimer();clearAutoSkip();stopNowPlaying()}
  else if(_wasPlaying){
    if(aud.paused||aud.readyState<2){
      const s=aud.src;
      if(s){aud.src=s;aud.play().catch(()=>{});startConnectTimer();}
      startNowPlaying();
    } else {
      startAutoSkip();
      startNowPlaying();
    }
  }
});

  [...el.querySelectorAll('img')].forEach(img=>{

/* ── marquee ── */
const _mqTimers = {};

function applyMarquee(wrapId, innerId, spanId, text){
  const wrap  = document.getElementById(wrapId);
  const inner = document.getElementById(innerId);
  const span  = document.getElementById(spanId);
  if(!wrap || !inner || !span) return;

  /* 진행 중인 측정 취소 */
  if(_mqTimers[wrapId]){ clearTimeout(_mqTimers[wrapId]); delete _mqTimers[wrapId]; }

  /* 1) 애니메이션 즉시 중단 → 텍스트 교체 → 클론 제거 */
  inner.classList.remove('running');
  inner.querySelectorAll('.mq-clone').forEach(c => c.remove());
  span.style.paddingRight = '';
  span.textContent = text;

  /* 2) 짧은 텍스트면 short 표시 후 종료 */
  wrap.classList.add('short');

  /* 3) 레이아웃 안정 후 실제 폭 측정 */
  _mqTimers[wrapId] = setTimeout(() => {
    delete _mqTimers[wrapId];

    /* wrap을 잠시 clip 해제해서 실제 span 폭을 측정 */
    const prevOverflow = wrap.style.overflow;
    wrap.style.overflow = 'visible';
    const spanW = span.getBoundingClientRect().width;
    const wrapW = wrap.getBoundingClientRect().width;
    wrap.style.overflow = prevOverflow || '';

    if(spanW <= wrapW + 1 || wrapW === 0){
      /* 충분히 짧음 — short 유지 */
      return;
    }

    /* 4) 스크롤 필요 → 클론 추가, px 거리 계산 */
    const gap = 64;
    span.style.paddingRight = gap + 'px';

    const clone = span.cloneNode(true);
    clone.classList.add('mq-clone');
    inner.appendChild(clone);

    /* 이동 거리 = 원본 span 폭(paddingRight 포함) */
    const dist = spanW + gap;
    const speed = 45; /* px/s */
    const dur   = dist / speed;

    inner.style.setProperty('--mq-dist', `-${dist}px`);
    inner.style.setProperty('--mq-dur',  `${dur}s`);

    /* mask 적용 */
    wrap.classList.remove('short');

    /* 다음 프레임에 running 추가 → animation 새로 시작 */
    requestAnimationFrame(() => inner.classList.add('running'));

  }, 60); /* 60ms: 폰트·레이아웃 안정 대기 */
}

/* 가로화면 전용: mpTitleWrap 재측정 */
function forceLandscapeMarquee(){
  const isLandscape = window.matchMedia(
    '(max-height:680px) and (orientation:landscape) and (max-width:960px)'
  ).matches;
  if(!isLandscape) return;
  const span = document.getElementById('mpTitle');
  if(!span || !span.textContent.trim() || span.textContent === '–') return;
  applyMarquee('mpTitleWrap','mpTitleInner','mpTitle', span.textContent);
}

/* ── 공통 crossfade 헬퍼 ──
   next 레이어에 이미지를 preload한 뒤 active 전환.
   url=null 이면 즉시 curr 제거(배경 없음 상태로). */
function _crossfade(nextEl, currEl, url, onReady, onError){
  if(!url){
    /* 이미지 없음 → 즉시 curr 숨기고 next도 빈 상태 */
    nextEl.style.backgroundImage = 'none';
    currEl.classList.remove('active');
    nextEl.classList.remove('active');
    if(onReady) onReady();
    return;
  }
  /* 이미지가 이미 캐시돼 있으면 load 이벤트 안 올 수 있으므로 Image() preload */
  const tmp = new Image();
  tmp.onload = () => {
    nextEl.style.backgroundImage = `url("${url}")`;
    /* 한 프레임 기다려 paint 완료 후 fade-in */
    requestAnimationFrame(() => {
      nextEl.classList.add('active');
      currEl.classList.remove('active');
      if(onReady) onReady();
    });
  };
  tmp.onerror = () => {
    /* 로드 실패 → curr 유지, 슬롯 롤백 콜백 호출 */
    if(onError) onError();
    if(onReady) onReady();
  };
  tmp.src = url;
}

function playChannel(ch){

  startConnectTimer();isSkipping=false;startAutoSkip();

  const hMeta=document.getElementById('heroMeta');

  if(hMeta){hMeta.classList.add('fading');setTimeout(()=>{hMeta.innerHTML='<span class="hero-np-loading">정보 불러오는 중…</span>';hMeta.classList.remove('fading')},200)}
  document.getElementById('heroOverlineText').textContent='NOW PLAYING · '+ch.cat;
  const catB=document.getElementById('heroCatBadge');
/* ── 카테고리 표시 ── */
  setHeroImage(imgSrc);
  const badge=document.getElementById('heroBadge');
  if(badge){document.getElementById('heroBadgeFreq').textContent=freq;badge.classList.add('visible')}

  /* player pill */
  document.getElementById('ppTag').textContent=ch.cat+' · '+ch.name;
  document.getElementById('ppFreq').textContent=freq;
  applyMarquee('ppTitleWrap','ppTitleInner','ppTitle','–');
  applyMarquee('ppArtistWrap','ppArtistInner','ppArtist','');
  const ppArt=document.getElementById('ppArt');
  resetArtEl(ppArt,'pp-art-ph');
  setPpBg(imgSrc);showPlayer();

  /* mobile player */
  document.getElementById('mpCat').textContent=ch.cat;
  document.getElementById('mpFreq').textContent=freq;
  applyMarquee('mpTitleWrap','mpTitleInner','mpTitle','–');
  applyMarquee('mpArtistWrap','mpArtistInner','mpArtist','');
  forceLandscapeMarquee();
  const mpArt=document.getElementById('mpArt');
  resetArtEl(mpArt,'mp-art-ph');
  setMpBg(imgSrc);

  /* state */
  setPlayIcon(true);setOnAir(false);
  renderDtList();renderMobCards();
  startNowPlaying();
}

/* ── 앨범아트 터치 오버레이 플래시 (모바일) ──
   :active CSS는 iOS에서 touchend 후에도 고착되므로
   JS로 직접 opacity를 켜고 600 ms 후 끕니다. */
(function(){
  let _artOverlayTimer = null;
  function artTouchFlash(overlayEl){
    if(!overlayEl) return;
    if(_artOverlayTimer){ clearTimeout(_artOverlayTimer); _artOverlayTimer = null; }
    overlayEl.style.opacity = '1';
    _artOverlayTimer = setTimeout(()=>{
      overlayEl.style.opacity = '';
      _artOverlayTimer = null;
    }, 600);
  }
  function attachArtTouch(artId, overlayId){
    const art = document.getElementById(artId);
    const ov  = document.getElementById(overlayId);
    if(!art || !ov) return;
    art.addEventListener('touchstart', ()=>{ ov.style.opacity = '1'; }, {passive:true});
    art.addEventListener('touchend',   ()=>{ artTouchFlash(ov); },      {passive:true});
    art.addEventListener('touchcancel',()=>{ ov.style.opacity = ''; },  {passive:true});
  }
  attachArtTouch('mpArt', 'mpArtOverlay');
  attachArtTouch('ppArt', 'ppArtOverlay');
})();

/* ── channel navigation ── */
function playPrevChannel(){
  if(activeExtraIdx!==null){
    if(!extraFiltered.length)return;
    const total=extraFiltered.length;
    let prev=null;
    for(let offset=1;offset<=total;offset++){
      const candidate=extraFiltered[(activeExtraIdx-offset+total)%total];
      if(!skippedExtraUrls.has(candidate.streamUrl)){prev=candidate;break}
    }
    if(!prev)return;
    activeExtraIdx=extraFiltered.indexOf(prev);
    playExtraChannel(prev);return;
  }
  if(!activeId)return;
  const avail=channels.filter(c=>!skippedIds.has(c.id));
  if(!avail.length)return;
  const ci=channels.findIndex(c=>c.id===activeId);
  const prev=avail.slice().reverse().find(c=>channels.indexOf(c)<ci)||avail[avail.length-1];
  playChannel(prev);
}
function playNextChannel(doSkip=false){
  /* 자동 스킵(타이머/에러)은 이미 스킵 중이면 무시.
     사용자 클릭(doSkip=false)은 항상 허용. */
  if(doSkip&&isSkipping)return;
  isSkipping=true;
  if(activeExtraIdx!==null){
    const cur=extraFiltered[activeExtraIdx];
    if(doSkip&&cur)skippedExtraUrls.add(cur.streamUrl);
    const total=extraFiltered.length;
    let next=null;
    for(let offset=1;offset<=total;offset++){
      const candidate=extraFiltered[(activeExtraIdx+offset)%total];
      if(!skippedExtraUrls.has(candidate.streamUrl)){next=candidate;break}
    }
    /* 모든 extra 채널 소진 → skipped 초기화 후 다음 채널부터 재시작 */
    if(!next){
      skippedExtraUrls.clear();
      const fallback=extraFiltered[(activeExtraIdx+1)%total];
      if(!fallback){isSkipping=false;return}
      activeExtraIdx=extraFiltered.indexOf(fallback);
      playExtraChannel(fallback);return;
    }
    activeExtraIdx=extraFiltered.indexOf(next);
    playExtraChannel(next);return;
  }
  if(!activeId)return;
  if(doSkip)skippedIds.add(activeId);
  let avail=channels.filter(c=>!skippedIds.has(c.id));
  /* 모든 일반 채널 소진 → skipped 초기화 후 재시작 */
  if(!avail.length){
    skippedIds.clear();
    avail=channels.slice();
  }
  if(!avail.length){isSkipping=false;return}
  const ci=channels.findIndex(c=>c.id===activeId);
  const next=avail.find(c=>channels.indexOf(c)>ci)||avail[0];
  playChannel(next);
}

/* ── media session ── */
function updateMediaSession(){
  if(!('mediaSession' in navigator))return;
  const ch=activeId?channels.find(c=>c.id===activeId):null;
  const exCh=activeExtraIdx!==null?extraFiltered[activeExtraIdx]:null;
  const title=document.getElementById('ppTitle')?.textContent||ch?.name||exCh?.name||'INSTATION';
  const artist=document.getElementById('ppArtist')?.textContent||ch?.cat||exCh?.tag||'';
  const art=currentArtUrl?[{src:currentArtUrl,sizes:'600x600',type:'image/png'}]:[];
  navigator.mediaSession.metadata=new MediaMetadata({title,artist,album:'INSTATION',artwork:art});
  navigator.mediaSession.playbackState='playing';
  navigator.mediaSession.setActionHandler('play',()=>{aud.play().catch(()=>{});setPlayIcon(true);startNowPlaying();startAutoSkip()});
  navigator.mediaSession.setActionHandler('pause',()=>{aud.pause();setPlayIcon(false);stopNowPlaying()});
  navigator.mediaSession.setActionHandler('nexttrack',()=>playNextChannel(false));
  navigator.mediaSession.setActionHandler('previoustrack',()=>playPrevChannel());
  navigator.mediaSession.setActionHandler('stop',()=>{aud.pause();setPlayIcon(false);stopNowPlaying()});
}

/* ── extra channels ── */
const EXTRA_URL='https://raw.githubusercontent.com/hckwon767/ins-play/refs/heads/main/channels.json';
function getExtraFiltered(){return extraCurrentTag==='ALL'?extraChannels:extraChannels.filter(c=>c.tag===extraCurrentTag)}

async function loadExtraChannels(){
  try{
    const res=await fetch(EXTRA_URL);
    const d=await res.json();
    extraChannels=d.channels;
    buildExtraTags();
    renderDtExtraList('ALL');
    renderMobExtraList('ALL');
  }catch(e){console.error('[EXTRA]',e)}
}

function buildExtraTags(){
  const tags=['ALL',...new Set(extraChannels.map(c=>c.tag))];
  ['dtExtraChips','mobExtraChips'].forEach(id=>{
    const bar=document.getElementById(id);if(!bar)return;
    bar.innerHTML='';
    tags.forEach(tag=>{
      const b=document.createElement('button');
      b.className='fchip'+(tag==='ALL'?' active':'');
      b.dataset.tag=tag;b.textContent=tag;
      b.onclick=()=>{renderDtExtraList(tag);renderMobExtraList(tag)};
      bar.appendChild(b);
    });
  });
}

/* ── Tag-based static image mapping (Unsplash CDN permanent URLs) ── */
/*
  각 tag 키워드 → Unsplash 큐레이션 이미지 (photo ID 기반 영구 URL)
  ?q=80&w=400&auto=format&fit=crop 파라미터로 최적화
  tag 매칭: 완전일치 → 부분문자열 → fallback
*/
const TAG_IMG_MAP={

  /* ───────── 한국/가요 ───────── */
  '가요':'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop',
  '노래':'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop',
  '추억음악':'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1200&auto=format&fit=crop',

  /* ───────── 일반 음악 ───────── */
  '음악':'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=1200&auto=format&fit=crop',

  /* ───────── POP ───────── */
  'pop':'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?q=80&w=1200&auto=format&fit=crop',

  /* ───────── 연주/클래식 ───────── */
  '연주':'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?q=80&w=1200&auto=format&fit=crop',
  '클래식':'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?q=80&w=1200&auto=format&fit=crop',

  /* ───────── 락/메탈 ───────── */
  '락&메탈':'https://images.unsplash.com/photo-1506157786151-b8491531f063?q=80&w=1200&auto=format&fit=crop',

  /* ───────── 재즈 ───────── */
  '재즈':'https://images.unsplash.com/photo-1415201364774-f6f0bb35f28f?q=80&w=1200&auto=format&fit=crop',

  /* ───────── 기타 ───────── */
  '기타':'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1200&auto=format&fit=crop',

  /* ───────── fallback ───────── */
  'default':'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=1200&auto=format&fit=crop',

};

function getTagImgUrl(tag){
  if(!tag)return TAG_IMG_MAP['default'];
  const t=tag.toLowerCase().trim();
  /* 1) 완전 일치 */
  if(TAG_IMG_MAP[t])return TAG_IMG_MAP[t];
  /* 2) 키 포함 여부 (e.g. "K-POP & Idol" → "kpop") */
  for(const key of Object.keys(TAG_IMG_MAP)){
    if(key==='default')continue;
    if(t.includes(key)||key.includes(t))return TAG_IMG_MAP[key];
  }
  return TAG_IMG_MAP['default'];
}

function loadExtraThumb(imgEl, tag){
  const url = getTagImgUrl(tag);
  imgEl.onload  = ()=>{ imgEl.classList.add('loaded'); imgEl.closest('.ex-thumb')?.classList.add('has-img'); };
  imgEl.onerror = ()=>{ /* keep placeholder */ };
  imgEl.src = url;
}

/* ── now playing — 원본 로직 그대로 ── */
async function fetchStatsMeta(port,host='live01.inlive.co.kr'){
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),5000);
    const res=await fetch(`https://${host}/stats.html?port=${port}`,
      {cache:'no-store',headers:{'Accept':'text/html,application/json,*/*'},signal:ctrl.signal});
    clearTimeout(tid);
    if(!res.ok)return null;
    const ct=res.headers.get('content-type')||'';
    if(ct.includes('json')){
      const d=await res.json();
      const title=d.title||d.currenttitle||d.current_song||d.songtitle||'';
      const artist=d.artist||d.currentartist||'';
      if(title||artist)return parseArtistTitle(artist,title);
      return null;
    }
    /* content-type이 json이 아니어도 JSON일 수 있음 — 텍스트로 읽어 시도 */
    const text=await res.text();
    const trimmed=text.trim();
    if(trimmed.startsWith('{')||trimmed.startsWith('[')){
      try{
        const d=JSON.parse(trimmed);
        const title=d.title||d.currenttitle||d.current_song||d.songtitle||'';
        const artist=d.artist||d.currentartist||'';
        if(title||artist)return parseArtistTitle(artist,title);
      }catch{}
    }
    return parseStatsHtml(text);
  }catch(e){console.debug('[NP]',e.message);return null}
}
function parseStatsHtml(html){
  const plain=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const parts=plain.split(',');
  if(parts.length>=6)return parseArtistTitle('',parts.slice(5).join(',').trim());
  if(plain.length>1&&plain.length<300)return parseArtistTitle('',plain);
  return null;
}
function parseArtistTitle(artist,raw){
  raw=(raw||'').trim();
  if(!raw&&!artist)return null;
  if(!artist&&raw.includes(' - ')){
    const idx=raw.indexOf(' - ');
    return{artist:raw.slice(0,idx).trim(),title:raw.slice(idx+3).trim()};
  }
  return{artist:(artist||'').trim(),title:raw};
}
async function fetchStatsMetaViaProxy(port,host='live01.inlive.co.kr'){
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),5000);
    const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://${host}/stats.html?port=${port}`)}`,{cache:'no-store',signal:ctrl.signal});
    clearTimeout(tid);
    if(!res.ok)return null;
    const d=await res.json();
    return d.contents?parseStatsHtml(d.contents):null;
  }catch(e){return null}
}
async function fetchAlbumArt(artist,title){
  try{
    const q=encodeURIComponent((artist?`${artist} `:'')+title);
    const res=await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=3`,{cache:'default'});
    if(!res.ok)return null;
    const d=await res.json();
    if(!d.results?.length)return null;
    return d.results[0].artworkUrl100.replace('100x100bb','600x600bb');
  }catch(e){return null}
}

function updateNowPlayingUI(artist,title,artUrl,loading=false){
  const ppArtEl=document.getElementById('ppArt');
  const mpArtEl=document.getElementById('mpArt');

  if(loading){
    applyMarquee('ppTitleWrap','ppTitleInner','ppTitle','불러오는 중…');
    applyMarquee('ppArtistWrap','ppArtistInner','ppArtist','');
    applyMarquee('mpTitleWrap','mpTitleInner','mpTitle','불러오는 중…');
    applyMarquee('mpArtistWrap','mpArtistInner','mpArtist','');
    const hm=document.getElementById('heroMeta');
    if(hm)hm.textContent='정보 불러오는 중…';
    return;
  }

  /* player pill — "아티스트 — 제목" 형태 */
  const ppDisplay=artist&&title?artist+' — '+title:title||artist||'–';
  applyMarquee('ppTitleWrap','ppTitleInner','ppTitle',ppDisplay);
  applyMarquee('ppArtistWrap','ppArtistInner','ppArtist','');

  /* mobile player — 제목 / 아티스트 분리 */
  applyMarquee('mpTitleWrap','mpTitleInner','mpTitle',title||'–');
  applyMarquee('mpArtistWrap','mpArtistInner','mpArtist',artist||'');
  /* 가로화면에서 폰트 크기가 커서 재판정 필요 (applyMarquee 내부 타이밍 후 실행) */
  forceLandscapeMarquee();

  /* hero — 제목을 heroTitle로, 아티스트를 heroMeta로 */
  const hTitle=document.getElementById('heroTitle');
  const hMeta=document.getElementById('heroMeta');
  if(title&&hTitle){
    hTitle.classList.add('fading');
    setTimeout(()=>{hTitle.textContent=title;hTitle.classList.remove('fading')},200);
  }
  if(hMeta){
    hMeta.classList.add('fading');
    setTimeout(()=>{hMeta.textContent=artist||'';hMeta.classList.remove('fading')},200);
  }

  if(artUrl===undefined)return;

  /* album art */
  _artImgs.forEach(img=>{img.onload=null;img.onerror=null;img.src=''});
  _artImgs=[];

  if(artUrl){
    /* pp art — crossfade: 새 img를 opacity:0으로 먼저 넣고 load 후 fade-in */
    if(ppArtEl){
      const img=new Image();_artImgs.push(img);
      img.alt=title||'';
      img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease';
      img.onload=()=>{
        /* 기존 img들 제거 후 새 img fade-in */
        [...ppArtEl.querySelectorAll('img')].forEach(old=>old.remove());
        ppArtEl.querySelector('.pp-art-ph')?.remove();
        ppArtEl.appendChild(img);
        ppArtEl.classList.add('has-art');
        requestAnimationFrame(()=>{ img.style.opacity='1'; });
      };
      img.onerror=()=>{ resetArtEl(ppArtEl,'pp-art-ph'); };
      img.src=artUrl;
    }
    /* mp art — 동일 crossfade */
    if(mpArtEl){
      const img2=new Image();_artImgs.push(img2);
      img2.alt=title||'';
      /* position:absolute + inset:0 으로 배치, opacity transition은 인라인으로 */
      img2.style.position='absolute';
      img2.style.inset='0';
      img2.style.width='100%';
      img2.style.height='100%';
      img2.style.objectFit='cover';
      img2.style.display='block';
      img2.style.opacity='0';
      img2.style.transition='opacity .5s ease';
      img2.onload=()=>{
        [...mpArtEl.querySelectorAll('img')].forEach(old=>old.remove());
        mpArtEl.querySelector('.mp-art-ph')?.remove();
        mpArtEl.appendChild(img2);
        mpArtEl.classList.add('has-art');
        requestAnimationFrame(()=>{ img2.style.opacity='1'; });
      };
      img2.onerror=()=>{ resetArtEl(mpArtEl,'mp-art-ph'); };
      img2.src=artUrl;
    }
    /* 배경 + hero 이미지 */
    setHeroImage(artUrl);
    setImmersiveBg(artUrl);setPpBg(artUrl);setMpBg(artUrl);
    currentArtUrl=artUrl;
  } else {
    resetArtEl(ppArtEl,'pp-art-ph');
    resetArtEl(mpArtEl,'mp-art-ph');
    setImmersiveBg(null);setPpBg(null);setMpBg(null);currentArtUrl=null;
  }
}

async function pollNowPlaying(){
  let port, host;
  if(activeId){
    port=getPort(activeId);
    host='live01.inlive.co.kr';
  } else if(activeExtraIdx!==null&&extraFiltered[activeExtraIdx]){
    try{
      const u=new URL(extraFiltered[activeExtraIdx].streamUrl);
      port=u.port;
      host=u.hostname;
    }catch(e){return}
  } else {
    return;
  }
  let meta=await fetchStatsMeta(port,host);
  if(!meta)meta=await fetchStatsMetaViaProxy(port,host);
  if(!meta)return;
  const trackStr=`${meta.artist}||${meta.title}`;
  if(trackStr===lastTrackStr)return;
  lastTrackStr=trackStr;
  updateNowPlayingUI(meta.artist,meta.title,undefined);
  const art=await fetchAlbumArt(meta.artist,meta.title);
  if(lastTrackStr===`${meta.artist}||${meta.title}`){
    updateNowPlayingUI(meta.artist,meta.title,art||null);
    updateMediaSession();
  }
}

function startNowPlaying(){
  lastTrackStr='';currentArtUrl=null;
  if(npTimer)clearInterval(npTimer);
  updateNowPlayingUI('','','',true);
  pollNowPlaying();
  npTimer=setInterval(pollNowPlaying,12000);
}
function stopNowPlaying(){
  if(npTimer){clearInterval(npTimer);npTimer=null}
  setOnAir(false);
  const ppA=document.getElementById('ppArt'),mpA=document.getElementById('mpArt');
  resetArtEl(ppA,'pp-art-ph');
  resetArtEl(mpA,'mp-art-ph');
  applyMarquee('ppTitleWrap','ppTitleInner','ppTitle','–');
  applyMarquee('ppArtistWrap','ppArtistInner','ppArtist','');
  applyMarquee('mpTitleWrap','mpTitleInner','mpTitle','–');
  applyMarquee('mpArtistWrap','mpArtistInner','mpArtist','');
  setImmersiveBg(null);setPpBg(null);setMpBg(null);
  lastTrackStr='';currentArtUrl=null;
}

}

<script>
// ── Capacitor 백그라운드 오디오 유지 ──────────────────────────
// Android WebView는 화면이 꺼지면 JS 실행을 멈추고 오디오를 끊음.
// 아래 방법들을 조합해서 백그라운드 재생을 유지함.

(function() {
  // 1) Wake Lock API: 화면 꺼짐 방지 (지원 기기만)
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(e) {}
  }
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });
  requestWakeLock();

  // 2) MediaSession API: OS에 "재생 중인 미디어" 등록
  //    → Android가 백그라운드에서도 오디오를 유지함
  function registerMediaSession(title, artist, artUrl) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title:  title  || 'INSTATION',
      artist: artist || '',
      artwork: artUrl ? [
        { src: artUrl, sizes: '512x512', type: 'image/jpeg' }
      ] : []
    });
    // 재생 컨트롤 핸들러 (잠금화면 버튼 대응)
    const aud = document.getElementById('aud');
    if (aud) {
      navigator.mediaSession.setActionHandler('play',  () => { aud.play();  updateMediaSessionState(); });
      navigator.mediaSession.setActionHandler('pause', () => { aud.pause(); updateMediaSessionState(); });
      navigator.mediaSession.setActionHandler('stop',  () => { aud.pause(); updateMediaSessionState(); });
    }
  }

  function updateMediaSessionState() {
    if (!('mediaSession' in navigator)) return;
    const aud = document.getElementById('aud');
    if (!aud) return;
    navigator.mediaSession.playbackState = aud.paused ? 'paused' : 'playing';
  }

  // 3) audio 엘리먼트에 이벤트 연결 (DOM 로딩 후 실행)
  document.addEventListener('DOMContentLoaded', () => {
    const aud = document.getElementById('aud');
    if (!aud) return;

    aud.addEventListener('play',  () => {
      updateMediaSessionState();
      registerMediaSession(
        aud.dataset.title  || 'INSTATION',
        aud.dataset.artist || '',
        aud.dataset.artUrl || ''
      );
    });
    aud.addEventListener('pause', updateMediaSessionState);

    // 4) 페이지가 백그라운드로 갈 때 재생 중이면 강제 유지
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && !aud.paused) {
        // 재생 중이면 아무것도 하지 않음 (pause 호출 금지)
        aud.play().catch(() => {});
      }
    });

    // 5) 1초 간격 keepalive: Android WebView JS 스로틀링 방지
    setInterval(() => {
      if (!aud.paused && aud.readyState < 3) {
        // stalled 상태면 재시작
        const src = aud.src;
        aud.src = src;
        aud.play().catch(() => {});
      }
    }, 1000);
  });

  // 6) NowPlaying 업데이트 시 MediaSession 메타데이터 갱신
  //    기존 코드의 updateNowPlayingUI 함수를 감싸서 실행
  window.addEventListener('load', () => {
    const origUpdate = window.updateNowPlayingUI;
    if (typeof origUpdate === 'function') {
      window.updateNowPlayingUI = function(artist, title, artUrl) {
        origUpdate.apply(this, arguments);
        registerMediaSession(title, artist, artUrl);
        const aud = document.getElementById('aud');
        if (aud) {
          aud.dataset.title  = title  || '';
          aud.dataset.artist = artist || '';
          aud.dataset.artUrl = artUrl || '';
        }
      };
    }
  });
})();
</script>
</body>
</html>
